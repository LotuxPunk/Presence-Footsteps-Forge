# Sets default memory used for Gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx5G
org.gradle.daemon=false
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configureondemand=true

org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
org.gradle.configuration-cache.problems=warn

net.minecraftforge.gradle.merge-source-sets=true

# Mod Properties
group=com.presencefootsteps
displayName=Presence Footsteps
authors=Hurricaaane (Ha3), Sollace, Paint_Ninja
description=An overly complicated sound mod
url=http://presencefootsteps.ha3.eu
